# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.2
loader_version=0.19.5
loom_version=1.17.13

# Mod Properties
mod_version=1.2.1
maven_group=itemalchemy.expansion
archives_base_name=itemalchemy-expansion

# Dependencies
fabric_version=0.161.0+26.2

# --- Addon target (Item Alchemy) + its dependency (mcpitanlib) ---
# Item Alchemy itself has no 26.2 release, so this addon keeps consuming its 1.20.1 build
# together with the 26.2 builds of the libraries below. All four are resolved from Modrinth's
# Maven repository (group maven.modrinth), so these are the versions used there.
itemalchemy_version=1.3.9
mcpitanlib_version=4.0.7-fix.1-fabric-26.2

# --- Optional config UI ---
cloth_config_version=26.2.155+fabric
modmenu_version=20.0.2
