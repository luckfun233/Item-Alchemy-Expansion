# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.4
yarn_mappings=1.21.4+build.8
loader_version=0.19.3
loom_version=1.15-SNAPSHOT

# Mod Properties
mod_version=1.2.2
maven_group=itemalchemy.expansion
archives_base_name=itemalchemy-expansion

# Dependencies
fabric_version=0.119.4+1.21.4

# --- Addon target (Item Alchemy) + its dependency (mcpitanlib) ---
# 从 1.21.4 运行环境的 mods 目录提取原版 jar，随仓库放在 libs/：
#   itemalchemy-1.4.1.jar（多版本通用 jar，minecraft: *）
#   mcpitanlib-4.0.9-1.21.4-fabric.jar
# mcpitanlib 4.x 不再依赖 architectury（3.x 需要）
itemalchemy_version=1.4.1
mcpitanlib_version=4.0.9-1.21.4-fabric

# --- Optional config UI (soft deps) ---
cloth_config_version=17.0.144
modmenu_version=13.0.4
