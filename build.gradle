plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// 本地 maven：itemalchemy 与 mcpitanlib 均通过 publishToMavenLocal 发布
	mavenLocal()
	// Item Alchemy + mcpitanlib（线上兜底）
	maven { url = "https://maven.pitan76.net/" }
	// architectury（mcpitanlib 传递依赖）
	maven { url = "https://maven.architectury.dev/" }
	// Cloth Config API
	maven { url = "https://maven.shedaniel.me/" }
	// Mod Menu
	maven { url = "https://maven.terraformersmc.com/releases/" }
	maven { url = "https://jitpack.io" }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"itemalchemy-expansion" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Item Alchemy (本模组的前置) + 其依赖 mcpitanlib
	// 本地构建版：mcpitanlib artifactId 为 mcpitanlib-fabric.1.21.1（'.' 代替 '+'）
	modImplementation "net.pitan76:itemalchemy:${project.itemalchemy_version}"
	modImplementation "net.pitan76:mcpitanlib-fabric.1.21.1:${project.mcpitanlib_version}"

	// 可选配置 UI：Cloth Config API + Mod Menu（运行时软依赖）
	modApi("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}
	modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
	}
}
